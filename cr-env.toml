# Mutation-testing config for src/cuda_link/_env.py (cosmic-ray 8.x).
# Workflow: cosmic-ray init cr-env.toml cr-env.sqlite
#           cosmic-ray baseline cr-env.toml
#           cosmic-ray exec cr-env.toml cr-env.sqlite
#           cr-report cr-env.sqlite
# The sqlite session files are regenerated artifacts — gitignored (cr-*.sqlite).
[cosmic-ray]
module-path = "src/cuda_link/_env.py"
timeout = 30.0
excluded-modules = []
# Absolute interpreter path: bare "python" resolves through the Windows App Paths
# registry to a potentially different environment.
test-command = "F:/RD_PROJECTS/COMPONENTS/cuda-link/.venv/Scripts/python.exe -m pytest tests/support/test_env.py -x -q --tb=no -p no:cacheprovider --randomly-seed=1"

[cosmic-ray.distributor]
name = "local"
