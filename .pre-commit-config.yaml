# Pre-commit hooks configuration
# Installation: pip install pre-commit && pre-commit install

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(Backup/|TD_RAG/|TOXES/)
      - id: trailing-whitespace
        exclude: ^(Backup/|TD_RAG/|TOXES/)
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: ^(Backup/|TOXES/)

  # Markdownlint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033]
        exclude: ^(CLAUDE\.md|MEMORY\.md|GEMINI\.md|TD_RAG/|Backup/)

  # Sync check — td_exporter/ paired files must stay in sync with src/cuda_link/
  # Edit src/cuda_link/<file>.py then run: python scripts/sync_td_wrapper.py
  # Pair list is authoritative in scripts/sync_td_wrapper.PAIRS (14 pairs).
  - repo: local
    hooks:
      - id: td-wrapper-sync-check
        name: td_exporter sync check (all paired modules)
        language: python
        entry: python scripts/sync_td_wrapper.py --check
        pass_filenames: false
        always_run: true

  # Pyrefly - Type checking (project mode: checks src/cuda_link/ + td_exporter/ per pyproject.toml)
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly (type checking)
        language: system
        entry: pyrefly check
        pass_filenames: false
        always_run: false
        files: ^(src/cuda_link|td_exporter)/.*\.py$
