# Mutation-testing config for src/cuda_link/_exporter_port.py (cosmic-ray 8.x).
# Workflow: cosmic-ray init cr-exporter_port.toml cr-exporter_port.sqlite
#           cosmic-ray baseline cr-exporter_port.toml
#           cosmic-ray exec cr-exporter_port.toml cr-exporter_port.sqlite
#           cr-report cr-exporter_port.sqlite
# The sqlite session files are regenerated artifacts — gitignored (cr-*.sqlite).
[cosmic-ray]
module-path = "src/cuda_link/_exporter_port.py"
timeout = 30.0
excluded-modules = []
# `uv run --no-sync python`: the venv of the checkout cosmic-ray runs in (worktrees too),
# on Windows and Linux. Not an absolute path: another checkout's venv imports that
# checkout's src through its editable install, so every mutant would survive. Not a
# relative .venv path: CreateProcess cannot find it, every run is INCOMPETENT and the
# baseline still says passed. --no-sync keeps a hand-installed CUDA torch.
# GpuFrame's slot meta checks (v0.6) are tested in test_slot_meta_fields.py and the Hypothesis
# properties; without them every _check_uint mutant reads as a survivor (Phase J5).
test-command = "uv run --no-sync python -m pytest tests/core/test_exporter_port.py tests/core/test_slot_meta_fields.py tests/core/test_protocol_properties.py -x -q --tb=no -p no:cacheprovider --randomly-seed=1 --hypothesis-profile=ci"

[cosmic-ray.distributor]
name = "local"
