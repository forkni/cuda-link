# cuda-link-native — optional native add-on accelerating cuda-link's Importer wait path.
#
# Two build modes:
#   * Pure-Python install (no native module): pip install -e . with the setuptools
#     fallback is NOT used here; instead, for development/CI without a GPU, put
#     native/src on PYTHONPATH (see native/tests/conftest.py) and use FakeWaitBackend.
#   * Full native build (Windows): scikit-build-core compiles _native_waiter via
#     CMakeLists.txt. No CUDA Toolkit / SDK is required at build time — the module
#     resolves cudaEventQuery from the already-loaded cudart at runtime.
[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "cuda-link-native"
version = "0.1.0"
description = "Native notification-wait accelerator for cuda-link's Importer consumer wait path."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Forkni", email = "forkni@gmail.com" }]
dependencies = [
  "cuda-link>=1.11.0",
]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Environment :: GPU :: NVIDIA CUDA",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-randomly>=3.15", "pytest-cov>=5.0"]

[tool.scikit-build]
wheel.packages = ["src/cuda_link_native"]
# Native module is Windows-only; on other platforms build a pure-Python wheel
# (FakeWaitBackend works; the native backend raises a clear error when used).
cmake.version = ">=3.24"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config --import-mode=importlib --randomly-dont-reset-seed"
markers = [
  "requires_native: test requires a real native _native_waiter build + GPU (deselect with -m 'not requires_native')",
]

[tool.coverage.run]
source = ["cuda_link_native"]
branch = true

[tool.coverage.report]
# No measured baseline yet (package is new) — gate set conservatively; raise once
# Phase 1/2 land and a real number is measured (mirrors spout/pyproject.toml's approach).
fail_under = 80
show_missing = true
