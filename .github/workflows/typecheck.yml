name: Type Check

on:
  push:
    branches: [development, main, master]
    paths:
      - 'src/cuda_link/**'
      - 'td_exporter/**'
      - 'pyproject.toml'
      - '.github/workflows/typecheck.yml'
  pull_request:
    paths:
      - 'src/cuda_link/**'
      - 'td_exporter/**'
      - 'pyproject.toml'
      - '.github/workflows/typecheck.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyrefly:
    name: pyrefly (static type check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'

      - name: Install pyrefly + numpy
        # numpy is the one optional dependency kept under real static checking
        # (it ships type stubs). torch / cupy / pynvml / nvtx / ml_dtypes / td
        # are treated as Any via [tool.pyrefly] replace-imports-with-any, so
        # this gate needs no CUDA toolchain, GPU, or TouchDesigner install.
        run: pip install "pyrefly==1.0.0" numpy

      - name: Run pyrefly
        # Project mode (no path arg): checks src/cuda_link/ + td_exporter/
        # engine + mirrors per project-includes/project-excludes in pyproject.toml.
        # python-platform = "win32" is set in pyproject.toml, so Windows-only
        # APIs (ctypes.windll, WINFUNCTYPE, ...) resolve on this Linux runner.
        run: pyrefly check
