name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the release job below needs write (to create the
# GitHub Release). The build job compiles wheels and must not hold a write token.
permissions:
  contents: read

jobs:
  # Windows-only: cuda-link is locked to Windows (see docs/adr/0013-prebuilt-wheel-distribution.md),
  # and the native wheel needs the MSVC + Windows SDK that windows-latest runners ship. Builds and
  # smoke-tests both distributed wheels so end users never need a local compiler -- see
  # scripts/install_td_library.py, which downloads whichever of these assets matches its target.
  build-wheels:
    name: Build wheels (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          # No pip cache here: this job builds the wheels that ship in the GitHub
          # Release, and a poisoned shared cache could inject code into them
          # (zizmor cache-poisoning audit). CI-only builds keep their cache.

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Sync td_exporter/CUDAIPCWrapper.py from canonical source
        run: python scripts/sync_td_wrapper.py

      - name: Build native wheel (cp311, compiles _native_waiter)
        # BUILD_NATIVE_WAITER defaults ON on Windows -- no flag needed.
        run: python -m build --wheel

      - name: Build fallback wheel (py3-none-any, no compiler)
        # -C cmake.define... is the only PEP 517-correct way to reach CMake through
        # the build frontend. wheel.py-api=py3 sets the Python/ABI tag; wheel.platlib=false
        # is what actually gets the "any" platform tag -- scikit-build-core defaults to
        # targeting platlib (hence win_amd64) whenever wheel.cmake is true, regardless of
        # py-api, since it doesn't auto-detect that this CMake configuration installs no
        # platform-specific files.
        run: python -m build --wheel -C cmake.define.BUILD_NATIVE_WAITER=OFF -C wheel.py-api=py3 -C wheel.platlib=false

      - name: List built wheels
        run: Get-ChildItem dist\*.whl

      - name: Install native wheel and exercise the compiled extension
        # First real compile-and-run of the C++ state machine in CI.
        # test_native_state_machine.py needs only the compiled extension (no
        # GPU/cudart) -- see its module docstring -- unlike test_native_smoke.py,
        # which needs a loaded cudart and can't run on these GPU-less runners.
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\cuda_link-*-cp311-cp311-win_amd64.whl | Select-Object -First 1
          python -m pip install "$($wheel.FullName)"
          python -c "import cuda_link._native_waiter; print('native extension imported OK')"
          python -m pip install pytest pytest-randomly
          pytest tests/core/test_native_state_machine.py -m requires_native -v

      - name: Upload wheels artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels
          path: dist/cuda_link-*.whl
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release + upload assets
    # workflow_dispatch runs (no tag) build + smoke-test the wheels above but stop
    # there -- softprops/action-gh-release requires an actual tag ref to attach to.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download built wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wheels
          path: dist

      - name: Extract changelog section for tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            index($0, "## [" v "]") == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "Release notes: $(wc -l < RELEASE_NOTES.md) lines"

      - name: Create GitHub Release with binary assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            TOXES/CUDAIPCLink_v*.tox
            CUDA_Link_Example*.toe
            dist/cuda_link-*.whl
          fail_on_unmatched_files: false
