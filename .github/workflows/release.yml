name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the release job below needs write (to create the
# GitHub Release). The build job compiles wheels and must not hold a write token.
permissions:
  contents: read

jobs:
  # Windows-only: cuda-link is locked to Windows (see docs/adr/0013-prebuilt-wheel-distribution.md),
  # and the native wheel needs MSVC + the Windows SDK. Builds and smoke-tests both distributed
  # wheels so end users never need a local compiler -- see scripts/install_td_library.py, which
  # downloads whichever of these assets matches its target. The cp311 wheel also carries the
  # TouchDesigner Custom TOP DLLs (cuda_link/td_plugins/, docs/CPP_TOP.md "Install: from the wheel").
  # windows-2022, not windows-latest: the CUDA 12.6 nvcc that builds the DLLs rejects the
  # VS 18 toolchain of windows-latest (same reason as cpp-top.yml).
  build-wheels:
    name: Build wheels (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          # No pip cache here: this job builds the wheels that ship in the GitHub
          # Release, and a poisoned shared cache could inject code into them
          # (zizmor cache-poisoning audit). CI-only builds keep their cache.

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Verify td_exporter mirror is in sync with src
        run: python scripts/sync_td_wrapper.py --check

      # The TOP DLLs: the same toolkit, MSVC setup and ninja-tooling preset as cpp-top.yml, so
      # the shipped DLLs are built the way CI tests them. cudart + nvcc only; no GPU needed.
      - name: Install CUDA toolkit (cudart + nvcc only)
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@4bd727d5619dc6fa323b1e76c3aa5dca94f5ec6d  # v0.2.19
        with:
          cuda: '12.6.2'
          sub-packages: '["cudart","nvcc"]'
          method: network

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64

      - name: Build the Custom TOP DLLs (CudaLinkOutTOP, CudaLinkInTOP)
        # The toolkit path goes through an env var, not a ${{ }} expansion inside the script
        # (zizmor template-injection rule). cpp_top stamps __version__ (src/cuda_link/__init__.py)
        # into each DLL; the native wheel build below refuses DLLs of another version.
        working-directory: cpp_top
        env:
          CUDA_TOOLKIT_ROOT: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
        run: |
          cmake --preset ninja-tooling "-DCUDAToolkit_ROOT=$env:CUDA_TOOLKIT_ROOT"
          cmake --build --preset ninja-tooling --target CudaLinkOutTOP CudaLinkInTOP

      - name: Build native wheel (cp311, compiles _native_waiter, ships the TOP DLLs)
        # BUILD_NATIVE_WAITER defaults ON on Windows -- no flag needed.
        run: python -m build --wheel "-Ccmake.define.CUDALINK_TD_PLUGIN_DIR=$env:GITHUB_WORKSPACE/cpp_top/build"

      - name: Build fallback wheel (py3-none-any, no compiler)
        # -C cmake.define... is the only PEP 517-correct way to reach CMake through
        # the build frontend. wheel.py-api=py3 sets the Python/ABI tag; wheel.platlib=false
        # is what actually gets the "any" platform tag -- scikit-build-core defaults to
        # targeting platlib (hence win_amd64) whenever wheel.cmake is true, regardless of
        # py-api, since it doesn't auto-detect that this CMake configuration installs no
        # platform-specific files.
        run: python -m build --wheel -C cmake.define.BUILD_NATIVE_WAITER=OFF -C wheel.py-api=py3 -C wheel.platlib=false

      - name: List built wheels
        run: Get-ChildItem dist\*.whl

      - name: Check the TOP DLLs in the wheels
        # cp311 wheel: both DLLs, stamped with the wheel version. py3-none-any wheel: none.
        shell: pwsh
        run: python scripts/check_wheel_plugins.py --require-plugins (Get-ChildItem dist\cuda_link-*.whl).FullName

      - name: Install native wheel and exercise the compiled extension
        # First real compile-and-run of the C++ state machine in CI.
        # test_native_state_machine.py needs only the compiled extension (no
        # GPU/cudart) -- see its module docstring -- unlike test_native_smoke.py,
        # which needs a loaded cudart and can't run on these GPU-less runners.
        shell: pwsh
        run: |
          # Stop on the first failing python/pip line: without this, pwsh runs on and the step
          # takes the exit code of the last line only (pwsh 7.3+).
          $PSNativeCommandUseErrorActionPreference = $true
          $wheel = Get-ChildItem dist\cuda_link-*-cp311-cp311-win_amd64.whl | Select-Object -First 1
          python -m pip install "$($wheel.FullName)"
          python -c "import cuda_link._native_waiter; print('native extension imported OK')"
          python -c "from cuda_link import td_plugin as t; assert t.has_plugins(), t.plugin_dir(); print('TOP DLLs found:', t.plugin_path('out'), t.plugin_path('in'))"
          python -m pip install pytest pytest-randomly
          pytest tests/core/test_native_state_machine.py -m requires_native -v

      - name: Upload wheels artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels
          path: dist/cuda_link-*.whl
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub Release + upload assets
    # workflow_dispatch runs (no tag) build + smoke-test the wheels above but stop
    # there -- softprops/action-gh-release requires an actual tag ref to attach to.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download built wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels
          path: dist

      - name: Extract changelog section for tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            index($0, "## [" v "]") == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "Release notes: $(wc -l < RELEASE_NOTES.md) lines"

      - name: Create GitHub Release with binary assets
        # Kept over a `gh release` script for now; swapping it is a release-flow change.
        # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            TOXES/CUDAIPCLink_v*.tox
            CUDA_Link_Example*.toe
            dist/cuda_link-*.whl
          fail_on_unmatched_files: false
