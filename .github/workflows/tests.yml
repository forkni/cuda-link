name: Tests

on:
  push:
    branches: [development, main, master, 'claude/**']
    paths:
      - 'src/cuda_link/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - '.github/workflows/tests.yml'
      - 'td_exporter/**'
      - 'scripts/sync_td_wrapper.py'
  pull_request:
    paths:
      - 'src/cuda_link/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - '.github/workflows/tests.yml'
      - 'td_exporter/**'
      - 'scripts/sync_td_wrapper.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (no GPU) — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # pytest-randomly enables the randomized test ordering configured in
        # pyproject.toml addopts (--randomly-dont-reset-seed). pytest-cov matches
        # the dev extra for parity. numpy + typing_extensions are required by the
        # no-GPU suite. torch is a best-effort CPU install: the few tests that
        # need it use pytest.importorskip, so the suite stays green on any Python
        # version without a CPU wheel. cupy is omitted (CUDA-only; no test marked
        # "not requires_cuda" needs it).
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-randomly pytest-cov typing_extensions numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu \
            || echo "::notice::torch CPU wheel unavailable for Python ${{ matrix.python-version }} — torch-dependent tests will skip"

      - name: Run no-GPU test suite
        # pytest reads pythonpath = ["src", "tests"] from pyproject.toml, so the
        # package and test helpers import without an editable install.
        # requires_cuda tests are deliberately local-only: this is a public repo,
        # so a self-hosted GPU runner is out (executes PR code on personal
        # hardware), and hosted GPU runners are Linux/T4 while this codebase is
        # Windows-locked (ctypes.windll). Run them on a GPU machine before releases.
        # requires_native tests are also deselected: this runner is ubuntu-latest
        # and never builds the Windows-only _native_waiter extension, so they'd
        # only skip anyway -- the marker keeps that explicit rather than implicit.
        # --cov enforces the fail_under gate in [tool.coverage.report] (pyproject.toml).
        # --cov-report=xml produces coverage.xml for Codecov upload below.
        run: pytest tests/ -m "not requires_cuda and not requires_native" --cov=cuda_link --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          files: ./coverage.xml
          flags: main
          token: ${{ secrets.CODECOV_TOKEN }}
          # fail_ci_if_error=false: keep CI green while the repo is being activated on
          # codecov.io (the upload is a no-op until CODECOV_TOKEN secret is set).
          fail_ci_if_error: false

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: coverage-main-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14
