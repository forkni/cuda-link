name: Tests

on:
  push:
    branches: [development, main, master, 'claude/**']
    paths:
      - 'src/cuda_link/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
      - 'td_exporter/**'
      - 'scripts/sync_td_wrapper.py'
      - 'spout/**'
  pull_request:
    paths:
      - 'src/cuda_link/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
      - 'td_exporter/**'
      - 'scripts/sync_td_wrapper.py'
      - 'spout/**'
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (no GPU) — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # pytest-randomly enables the randomized test ordering configured in
        # pyproject.toml addopts (--randomly-dont-reset-seed). pytest-cov matches
        # the dev extra for parity. numpy + typing_extensions are required by the
        # no-GPU suite. torch is a best-effort CPU install: the few tests that
        # need it use pytest.importorskip, so the suite stays green on any Python
        # version without a CPU wheel. cupy is omitted (CUDA-only; no test marked
        # "not requires_cuda" needs it).
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-randomly pytest-cov typing_extensions numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu \
            || echo "::notice::torch CPU wheel unavailable for Python ${{ matrix.python-version }} — torch-dependent tests will skip"

      - name: Run no-GPU test suite
        # pytest reads pythonpath = ["src", "tests"] from pyproject.toml, so the
        # package and test helpers import without an editable install.
        # --cov enforces the fail_under gate in [tool.coverage.report] (pyproject.toml).
        run: pytest tests/ -m "not requires_cuda" --cov=cuda_link --cov-report=term-missing -q

  spout-tests:
    name: spout pytest (no GPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        # cuda-link is a runtime dependency of cuda_link_spout (for CUDAMemoryRef etc.).
        # Install it in editable mode first so the spout package can import it.
        # pytest-randomly + pytest-cov match the spout/pyproject.toml dev config.
        # The native _spout_bridge extension requires Windows + GPU; FakeSpoutBackend
        # replaces it for all tests not marked requires_spout.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-randomly pytest-cov numpy

      - name: Run no-GPU spout test suite
        # pytest reads [tool.pytest.ini_options] from spout/pyproject.toml when run
        # from the spout/ directory (rootdir = spout/).
        # --cov enforces the fail_under gate in [tool.coverage.report] (spout/pyproject.toml).
        # Verified order-independent across 20 randomized seeds (2026-06-29).
        run: cd spout && pytest tests -m "not requires_spout" --cov=cuda_link_spout --cov-report=term-missing -q
