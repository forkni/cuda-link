name: Documentation Validation

on:
  push:
    branches: [development, main, master]
    paths:
      - '**/*.md'
  pull_request:
    paths:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run markdownlint
        # v24.2.0 bundles markdownlint-cli2 0.23.2 -- keep CGW_MARKDOWNLINT_CMD
        # in .cgw.conf pinned to the same version when bumping this SHA.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            **/*.md

  link-check:
    name: Link Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: |
            --verbose
            --no-progress
            --exclude-path TD_RAG
            --exclude-path Backup
            --exclude-path TOXES
            --exclude-path .venv
            --exclude-mail
            '**/*.md'
        continue-on-error: true

  spelling:
    name: Spelling Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b  # v1.50.1
        with:
          files: docs/ README.md
        continue-on-error: true
