[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-link"
version = "1.11.0"
description = "Zero-copy GPU texture sharing via CUDA IPC for TouchDesigner integration"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "forkni", email = "forkni@gmail.com"}
]
keywords = ["cuda", "ipc", "touchdesigner", "gpu", "zero-copy", "texture-sharing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No required dependencies - pure ctypes wrapper
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.0"]
numpy = ["numpy>=1.21"]
cupy = ["cupy-cuda12x>=12.0"]
nvml = ["nvidia-ml-py>=12.535"]
all = ["cuda-link[torch,numpy,cupy,nvml]"]
dev = [
    "cuda-link[all]",
    "pytest>=7.0",
    "ruff",
    "pyrefly",
    "snoop>=0.4",
    "py-heat>=0.0.6",
    "nvtx>=0.2",
    "scalene>=1.5",
]

[project.urls]
Homepage = "https://github.com/forkni/cuda-link"
Documentation = "https://github.com/forkni/cuda-link/tree/main/docs"
Repository = "https://github.com/forkni/cuda-link"
Issues = "https://github.com/forkni/cuda-link/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "td_exporter", "tests"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = [
    "requires_cuda: marks tests as requiring CUDA GPU (deselect with '-m \"not requires_cuda\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"td_exporter/*" = ["N801", "N802", "N803", "N813", "N814", "F821", "I001"]  # TD naming + generated-file exemptions: __delTD__, ownerComp, COMP/TOP fallbacks; C-struct naming; TD built-in globals; import sort irrelevant in generated files
"benchmarks/*" = ["N801"]  # C-struct naming (cudaIpcMemHandle_t)
"tests/*" = ["N802", "N806"]  # Allow test method names like test_* and test constant naming
"src/cuda_link/cuda_ipc_wrapper.py" = ["N801"]  # C-struct naming (cudaIpcMemHandle_t, etc.)
"src/cuda_link/cuda_runtime_types.py" = ["N801"]  # C-struct naming (cudaIpcMemHandle_t, cudaIpcEventHandle_t)
".claude/hooks/*" = ["N806", "F841", "F541"]  # Hook scripts may have different conventions
"verification/*" = ["F821", "SIM105", "SIM210"]  # TD textport scripts: op/baseCOMP/scriptTOP etc. are TD built-in globals; probe patterns intentionally use try/except/pass

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyrefly]
python-version = "3.11.0"
# cuda-link targets Windows exclusively (CUDA IPC is Windows-only). Evaluate
# type checks against win32 so ctypes.windll / WINFUNCTYPE and other
# platform-gated code resolve on any developer or CI host.
python-platform = "win32"
# Point pyrefly at the project Python so site-packages (numpy, etc.) resolve
# correctly. On CI (Linux) this path won't exist; pyrefly falls back to the
# PATH python, which is whatever setup-python@v4 activated — also fine.
python-interpreter-path = "C:/Users/Fractal01/AppData/Local/Programs/Python/Python311/python.exe"
# Optional GPU/telemetry deps are imported under try/except and bound to None
# when absent. Treat them as Any so type-checking does not require a CUDA
# toolchain in CI; the runtime None-guards remain authoritative.
# td is TouchDesigner's built-in module (COMP, TOP, CUDAMemoryShape, ui …);
# it only exists inside the TD interpreter, so treat all td.* imports as Any.
replace-imports-with-any = [
    "torch", "torch.*", "cupy", "cupy.*", "pynvml", "nvtx", "ml_dtypes",
    "td", "td.*",
]
# Add td_exporter/ to the import search path so flat-namespace sibling imports
# (e.g. `from CUDAIPCWrapper import …`) resolve inside that tree.
search-path = ["src", "td_exporter"]
# --- What to check -----------------------------------------------------------
# Project mode (pyrefly check, no CLI path): src/cuda_link + td_exporter
# engine + mirrors; pure-TD glue/demo scripts excluded (low static-check value,
# high noise from bare TD globals injected by TD's COMP namespace).
project-includes = [
    "src/cuda_link/**/*.py",
    "td_exporter/**/*.py",
]
project-excludes = [
    "td_exporter/callbacks_template.py",
    "td_exporter/parexecute_callbacks.py",
    "td_exporter/script_top_callbacks.py",
    "td_exporter/example_sender_launcher.py",
    "td_exporter/example_receiver_launcher.py",
    "td_exporter/example_sender_python.py",
    "td_exporter/example_receiver_python.py",
]

# --- Scoped type-check suppressions ------------------------------------------
# Policy (docs/adr/0005-static-typing-hardening.md): NO package-wide category
# blanket. Each block below disables only the categories a specific module
# legitimately triggers due to a deliberate, documented idiom. Every other
# module in src/cuda_link/ and td_exporter/ is now fully type-checked.

# ---- src/cuda_link/ ----------------------------------------------------------

# Consumer engine: optional libs bound to None (missing-attribute), ctypes
# c_void_p<->int pointer duality (bad-argument-type), and SharedMemory buffers
# that are Optional until attached (unsupported-operation).
[[tool.pyrefly.sub-config]]
matches = "src/cuda_link/importer.py"
errors = {missing-attribute = false, bad-argument-type = false, unsupported-operation = false}

# Optional NVML telemetry: pynvml bound to None when nvidia-ml-py is absent.
[[tool.pyrefly.sub-config]]
matches = "src/cuda_link/nvml_observer.py"
errors = {missing-attribute = false}

# Producer engine: ctypes pointer duality, dynamic CUDARuntimeAPI delegation
# (CTypesCUDAAdapter.__getattr__), and Optional-until-attached shm buffers.
[[tool.pyrefly.sub-config]]
matches = "src/cuda_link/exporter.py"
errors = {bad-argument-type = false, unsupported-operation = false, bad-assignment = false, missing-attribute = false}

# Cross-process activation barrier: SharedMemory buffer is Optional until attached.
[[tool.pyrefly.sub-config]]
matches = "src/cuda_link/activation_barrier.py"
errors = {bad-argument-type = false, unsupported-operation = false}

# CUDA ctypes seam: TD flat-namespace fallback import of CUDAGraphsMixin.
[[tool.pyrefly.sub-config]]
matches = "src/cuda_link/cuda_ipc_wrapper.py"
errors = {invalid-inheritance = false}

# CUDA Graphs mixin: ctypes c_void_p<->int pointer duality.
[[tool.pyrefly.sub-config]]
matches = "src/cuda_link/cuda_graphs.py"
errors = {bad-argument-type = false}

# Deprecated pre-v1.5 importer shim retained for back-compat.
[[tool.pyrefly.sub-config]]
matches = "src/cuda_link/cuda_ipc_importer.py"
errors = {bad-argument-type = false}

# ---- td_exporter/ mirrors ---------------------------------------------------
# Mirror files are generated by scripts/sync_td_wrapper.py from their
# src/cuda_link/ twins; each block below mirrors the suppression of the
# canonical source for the same deliberate, documented idiom.

# Consumer engine mirror (same idioms as src/cuda_link/importer.py).
[[tool.pyrefly.sub-config]]
matches = "td_exporter/Importer.py"
errors = {missing-attribute = false, bad-argument-type = false, unsupported-operation = false}

# Optional NVML telemetry mirror (same as src/cuda_link/nvml_observer.py).
[[tool.pyrefly.sub-config]]
matches = "td_exporter/NVMLObserver.py"
errors = {missing-attribute = false}

# Producer engine mirror (same idioms as src/cuda_link/exporter.py).
[[tool.pyrefly.sub-config]]
matches = "td_exporter/Exporter.py"
errors = {bad-argument-type = false, unsupported-operation = false, bad-assignment = false, missing-attribute = false}

# Activation barrier mirror (same as src/cuda_link/activation_barrier.py).
[[tool.pyrefly.sub-config]]
matches = "td_exporter/ActivationBarrier.py"
errors = {bad-argument-type = false, unsupported-operation = false}

# CUDA ctypes seam mirror (same as src/cuda_link/cuda_ipc_wrapper.py).
[[tool.pyrefly.sub-config]]
matches = "td_exporter/CUDAIPCWrapper.py"
errors = {invalid-inheritance = false}

# CUDA Graphs mirror (same as src/cuda_link/cuda_graphs.py).
[[tool.pyrefly.sub-config]]
matches = "td_exporter/CUDAGraphs.py"
errors = {bad-argument-type = false}

# ---- td_exporter/ TD-native engine files ------------------------------------

# Extension facade: self._engine is TDSenderEngine | TDReceiverEngine | None;
# pyrefly cannot narrow the union across all call sites (missing-attribute on
# the "wrong" variant). This is a deliberate single-field dispatch pattern.
[[tool.pyrefly.sub-config]]
matches = "td_exporter/CUDAIPCExtension.py"
errors = {missing-attribute = false}

# Receiver engine: cupy optional-import-as-None (missing-attribute on cp.*),
# shm_handle / _connection fields typed as object pre-connection
# (missing-attribute, bad-argument-type, unsupported-operation, bad-index),
# ctypes c_void_p<->int duality (bad-argument-type), a numpy.frombuffer
# overload mismatch for c_ubyte arrays (no-matching-overload), and a paired
# diagnostic timing variable that pyrefly cannot prove is always initialized
# within the same _diag guard (unbound-name).
[[tool.pyrefly.sub-config]]
matches = "td_exporter/TDReceiver.py"
errors = {missing-attribute = false, bad-argument-type = false, unsupported-operation = false, bad-index = false, no-matching-overload = false, unbound-name = false}

# Sender engine: same Optional-field-as-NoneType and top_op-as-object patterns
# as TDReceiver (missing-attribute), plus shm.buf Optional-buffer
# (bad-argument-type).
[[tool.pyrefly.sub-config]]
matches = "td_exporter/TDSender.py"
errors = {missing-attribute = false, bad-argument-type = false}

# In-process test doubles: FakeCUDAMemoryRef has the same fields as
# CUDAMemoryRef but does not inherit from it (separate dataclass with
# different __init__ defaults). The override mismatch is nominal, not
# structural; all CUDAMemoryRef attributes are present on FakeCUDAMemoryRef.
[[tool.pyrefly.sub-config]]
matches = "td_exporter/_td_fakes.py"
errors = {bad-override = false}

# Timestamp utility: shm.buf is Optional[memoryview] until shm is attached —
# same pattern as activation_barrier.py (bad-argument-type).
[[tool.pyrefly.sub-config]]
matches = "td_exporter/benchmark_timestamp.py"
errors = {bad-argument-type = false}
