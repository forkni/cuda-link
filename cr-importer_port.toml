# Mutation-testing config for src/cuda_link/_importer_port.py (cosmic-ray 8.x).
# Workflow: cosmic-ray init cr-importer_port.toml cr-importer_port.sqlite
#           cosmic-ray baseline cr-importer_port.toml
#           cosmic-ray exec cr-importer_port.toml cr-importer_port.sqlite
#           cr-report cr-importer_port.sqlite
# The sqlite session files are regenerated artifacts — gitignored (cr-*.sqlite).
[cosmic-ray]
module-path = "src/cuda_link/_importer_port.py"
timeout = 30.0
excluded-modules = []
# `uv run --no-sync python`: the venv of the checkout cosmic-ray runs in (worktrees too),
# on Windows and Linux. Not an absolute path: another checkout's venv imports that
# checkout's src through its editable install, so every mutant would survive. Not a
# relative .venv path: CreateProcess cannot find it, every run is INCOMPETENT and the
# baseline still says passed. --no-sync keeps a hand-installed CUDA torch.
test-command = "uv run --no-sync python -m pytest tests/core/test_importer_port.py -x -q --tb=no -p no:cacheprovider --randomly-seed=1"

[cosmic-ray.distributor]
name = "local"
